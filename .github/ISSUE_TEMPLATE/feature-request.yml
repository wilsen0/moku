name: 💡 Feature or Mascot (Soot) Idea
description: Suggest a new feature, terminal tool, or new costume/interaction for Soot (煤球).
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for Moku or a new cosmetic outfit for Soot the pixel mascot? Let us know!
  - type: textarea
    id: idea
    attributes:
      label: Your Idea & Use Case
      description: What would you like to see added or changed, and how would it improve your workflow?
      placeholder: "Describe your idea..."
    validations:
      required: true
